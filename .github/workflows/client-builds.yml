name: Windows and iOS client builds
on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: Build the unsigned iOS package
        type: boolean
        default: false
  push:
    paths:
      - 'client/**'
      - '.github/workflows/client-builds.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - name: Check client recovery tests
        working-directory: client
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build Windows tunnel
        shell: bash
        run: |
          curl --fail --location --retry 3 --output wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  wintun.zip' | sha256sum --check
          unzip -q wintun.zip
          bash client/scripts/build_windows_tunnel.sh amd64 wintun/bin/amd64/wintun.dll
          (cd work/libXray-v26.11.9 && go build -mod=readonly -trimpath -o ../26x-test-relay.exe github.com/xtls/xray-core/main)
      - name: Build Windows client
        working-directory: client
        run: flutter build windows --release --build-name=0.1.9 --build-number=25 --dart-define=API_BASE_URL=https://26xvpn.com
      - name: Include Wintun license
        shell: bash
        run: cp wintun/LICENSE.txt client/build/windows/x64/runner/Release/
      - name: Package Windows installer
        working-directory: client/windows
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $nsis)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $nsis 26x-setup.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows installation and removal
        shell: pwsh
        run: client/scripts/test_windows_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: 26x-Windows-x64
          path: |
            client/windows/26x-VPN-0.1.9-Setup-x64.exe
            client/windows/windows-package-report.json
            client/windows/windows-icon-preview.png
          if-no-files-found: error
  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - name: Build iOS tunnel
        run: bash client/scripts/build_libxray.sh ios
      - name: Build iPhone app and bundle the unsigned IPA
        working-directory: client
        run: |
          flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://26xvpn.com
          mkdir -p build/ios/Payload
          mv build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -qr 26x-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: 26x-iOS-unsigned
          path: client/build/ios/26x-iOS-unsigned.ipa
          if-no-files-found: error

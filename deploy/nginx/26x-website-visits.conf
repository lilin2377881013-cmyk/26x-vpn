# Install in /etc/nginx/conf.d. Only HTML document requests are eligible.
map $uri $visit_page {
    default "";
    / /;
    /account /account;
    /account/login /account/login;
    /support /support;
    /privacy /privacy;
    /terms /terms;
}
map $arg_ref $visit_ref {
    default "";
    "~^[A-Za-z0-9_-]{16}$" $arg_ref;
}
map "$host|$request_method|$status|$visit_page|$http_rsc|$http_next_router_prefetch|$http_sec_purpose|$http_purpose|$arg__rsc" $log_26x_visit {
    default 0;
    "~^26xvpn\.com\|GET\|(200|304)\|/[^|]*\|\|\|\|\|$" 1;
}
log_format website_visit escape=json '{"id":"$request_id","at":"$time_iso8601","page":"$visit_page","ref":"$visit_ref","ua":"$http_user_agent"}';
